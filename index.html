<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="DC Technology - Componentes y Laptops de Alto Rendimiento. Compra segura con asesoría IA.">
  <title>DC Technology | Hardware Premium</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Alertas Flotantes (Toasts) -->
  <div id="toast-container" class="toast-container"></div>

  <div class="top-bar">
    <div class="top-bar-content">
      <span><i class="fa-solid fa-bolt text-accent"></i> Envío Nacional Express | Seguro Contra Daños</span>
      <div class="countdown" id="countdown" aria-label="Tiempo restante de la oferta">04:59:59</div>
    </div>
  </div>

  <nav class="navbar" role="navigation">
    <div class="nav-container">
      <a href="#" class="brand-logo" aria-label="Inicio DC Technology">
        <div class="logo-icon"><i class="fa-solid fa-microchip"></i></div>
        <div class="logo-text">DC <span>TECHNOLOGY</span></div>
      </a>
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="search" id="buscador" class="search-input" placeholder="Buscar RTX, Ryzen, Monitores..." oninput="filtrarProductos()">
        <div class="search-shortcut">/</div>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-bg-glow"></div>
    <div class="hero-content">
      <div class="premium-badge"><i class="fa-solid fa-gem"></i> Hardware Enthusiast 2026</div>
      <h1 class="hero-title">El Setup de tus Sueños,<br><span class="text-gradient">A un Clic de Distancia.</span></h1>
      <p class="hero-subtitle">Conecta directamente con nuestra IA de ventas para despachos inmediatos.</p>
    </div>
  </header>

  <main class="store-container">
    <div class="section-header">
      <h2>Catálogo <span class="text-gradient">Premium</span></h2>
      <div class="filter-pills" id="contenedor-filtros" role="group">
        <button class="filter-btn active" data-categoria="todos">Todo</button>
        <button class="filter-btn" data-categoria="laptops">Laptops</button>
        <button class="filter-btn" data-categoria="monitores">Monitores</button>
        <button class="filter-btn" data-categoria="perifericos">Periféricos</button>
      </div>
    </div>

    <div class="product-grid" id="grid-productos">
      <!-- Carga dinámica -->
    </div>
  </main>

  <a href="https://wa.me/573000000000" target="_blank" class="floating-wa" aria-label="Contactar por WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
    <span class="wa-tooltip">Asesoría IA 24/7</span>
  </a>

  <script>
    const NUMERO_WHATSAPP = "573000000000"; 
    let productosGlobal = [];
    const formatoCOP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });

    function mostrarToast(mensaje) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast show';
      toast.innerHTML = `<i class="fa-solid fa-check-circle" style="color:var(--success)"></i> ${mensaje}`;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    async function cargarCatalogo() {
      try {
        const res = await fetch('productos.json');
        if (!res.ok) throw new Error("JSON no accesible");
        productosGlobal = await res.json();
      } catch (error) {
        productosGlobal = [
          { id: 101, titulo: "Asus ROG Zephyrus G14 OLED", precio: 7500000, precioAnterior: 8200000, categoria: "laptops", img: "https://via.placeholder.com/300x200/0d1321/00f2fe?text=ROG", stock: 2, vendido: 90 },
          { id: 102, titulo: "Monitor Alienware 34' QD-OLED", precio: 4800000, categoria: "monitores", img: "https://via.placeholder.com/300x200/0d1321/fbbf24?text=Alienware", stock: 5, vendido: 60 }
        ];
      }
      renderizarProductos(productosGlobal);
    }

    window.iniciarCompra = function(id, titulo, precio) {
      mostrarToast("Conectando con asesor...");
      const msg = encodeURIComponent(`⚡ ¡Hola DC Technology!\n\nInicio proceso de compra para:\n*${titulo}*\n*Ref:* #${id}\n*Precio:* ${formatoCOP.format(precio)}\n\nEspero confirmación de stock y métodos de pago.`);
      setTimeout(() => { window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${msg}`, '_blank'); }, 800);
    }

    function renderizarProductos(productos) {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = productos.map(p => {
        const precioViejo = p.precioAnterior || Math.round(p.precio * 1.15);
        const porcentaje = Math.round(((precioViejo - p.precio) / precioViejo) * 100);
        return `
          <article class="product-card">
            <div class="card-badges">
              <span class="badge badge-discount">-${porcentaje}%</span>
              ${(p.stock || 3) <= 3 ? `<span class="badge badge-urgent"><i class="fa-solid fa-fire"></i> ¡Últimos ${(p.stock || 3)}!</span>` : ''}
            </div>
            <div class="card-image-wrapper">
              <img src="${p.img || 'https://via.placeholder.com/300'}" alt="${p.titulo}" loading="lazy" width="300" height="200">
            </div>
            <div class="card-info">
              <h3 class="product-name">${p.titulo}</h3>
              <div class="pricing">
                <div class="price-main">${formatoCOP.format(p.precio)}</div>
                <div class="price-old">${formatoCOP.format(precioViejo)}</div>
              </div>
            </div>
            <button onclick="iniciarCompra(${p.id}, '${p.titulo}', ${p.precio})" class="btn-buy shine-effect">
              <i class="fa-brands fa-whatsapp"></i> Comprar Ahora
            </button>
          </article>
        `;
      }).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const cat = e.target.getAttribute('data-categoria');
        renderizarProductos(cat === 'todos' ? productosGlobal : productosGlobal.filter(p => p.categoria === cat));
      });
    });

    window.onload = cargarCatalogo;
  </script>
</body>
</html>
