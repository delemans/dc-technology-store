<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Technology | Tienda Premium</title>
  <style>
    body { background-color: #030712; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 2rem; }
    .product-card { background: #0f172a; padding: 1.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); margin: 1rem auto; max-width: 300px; }
    .product-card img { max-width: 100%; border-radius: 8px; }
    .btn { background: #10b981; color: white; padding: 1rem; border-radius: 8px; text-decoration: none; display: block; margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>DC Technology Premium</h1>
  <div id="grid-productos"></div>
  <script>
    async function cargar() {
      const res = await fetch('productos.json');
      const data = await res.json();
      document.getElementById('grid-productos').innerHTML = data.map(p => `
        <div class="product-card">
          <img src="${p.img}">
          <h3>${p.titulo}</h3>
          <h2>$${p.precio}</h2>
          <a href="#" class="btn">Comprar Ahora</a>
        </div>
      `).join('');
    }
    cargar();
  </script>
</body>
</html>
